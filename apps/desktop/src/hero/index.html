<!doctype html>
<!-- the hero town alone, to try it and for its checks (`pnpm hero`; the built one: site/desktop/hero/try.html) -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bims town · hero</title>
    <style>
      body { margin: 0; background: #f2ede2; font: 14px system-ui; }
      html.pd body { background: #171513; }
      .row { display: flex; height: 100vh; }
      .text { width: 40%; padding: 8vh 4vw; color: #555; }
      .town { width: 60%; height: 100%; -webkit-mask-image: linear-gradient(to right, transparent, #000 20%); mask-image: linear-gradient(to right, transparent, #000 20%); }
      .ctl { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 6px; }
      @media (max-width: 1000px) { .row { flex-direction: column; } .town { width: 100%; height: 58vh; order: -1; mask-image: none; -webkit-mask-image: none; } .text { width: auto; } }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="text"><h1>your team, live</h1><p>drag to look around.</p></div>
      <div class="town" id="town"></div>
    </div>
    <div class="ctl"><button id="zin">+</button><button id="zout">−</button><button id="back" hidden>▶ back to the film</button><button id="dark">dark</button></div>
    <script type="module">
      import { mount } from './hero.ts';
      const q = new URLSearchParams(location.search);
      const dark = q.has('dark');
      if (dark) document.documentElement.classList.add('pd');
      const town = mount(document.getElementById('town'), { theme: dark ? 'dark' : 'light' });
      window.__town = town;
      document.getElementById('zin').onclick = () => town.zoom(1);
      document.getElementById('zout').onclick = () => town.zoom(-1);
      document.getElementById('back').onclick = () => town.resumeFilm();
      document.getElementById('dark').onclick = () => { const d = document.documentElement.classList.toggle('pd'); town.setTheme(d ? 'dark' : 'light'); };
      town.on('control', () => { document.getElementById('back').hidden = false; });
      town.on('film', () => { document.getElementById('back').hidden = true; });
    </script>
  </body>
</html>
