<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ambient · glass</title>
<link rel="stylesheet" href="amb.css">
<style>
/* A · glass: a frosted capsule that grows from the menu bar; the voice-mode face is the orb */
.wall-a{background:
  radial-gradient(60% 70% at 85% 10%,#ff9fb2 0%,transparent 60%),
  radial-gradient(70% 80% at 10% 90%,#3b2a6b 0%,transparent 60%),
  radial-gradient(50% 60% at 60% 70%,#f2a65a 0%,transparent 60%),
  linear-gradient(160deg,#2a1b3d,#5b2d4f 45%,#c66b5a 80%,#f1b37a)}
.g{position:absolute;right:20px;top:40px;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  background:linear-gradient(180deg,#2a2224b0,#1a1516c8);backdrop-filter:blur(44px) saturate(1.9);-webkit-backdrop-filter:blur(44px) saturate(1.9);
  border-radius:28px;box-shadow:inset 0 0 0 1px #ffffff26,inset 0 1px 0 #ffffff30,0 24px 70px -20px #000a;overflow:hidden;transform-origin:top right}
.g .m{font-family:"JetBrains Mono",monospace}
.acc{color:#f4a6b0}.dim{color:#ffffffa0}.faint{color:#ffffff70}
canvas.fc{color:#f4a6b0;display:block}
/* the halo while you talk: a soft pink rim that breathes with your voice */
.g.live::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--a,0deg),#f4a6b0,#ffd6c2,#c9a6f4,#f4a6b0);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  opacity:calc(.45 + var(--k,0) * .55);animation:spin 4s linear infinite}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.g.grow{animation:grow .6s cubic-bezier(.16,1,.3,1)}
@keyframes grow{from{transform:scale(.55,.18);opacity:.3;border-radius:40px}to{transform:none;opacity:1}}
/* the capsule (idle) */
.pill{display:flex;align-items:center;gap:12px;padding:9px 18px 9px 12px;font-size:14px}
.pill .gust{color:#ffffffa0;font-size:13px;letter-spacing:1px}
/* big card */
.card{width:440px;padding:22px 24px 20px}
.head{display:flex;align-items:center;gap:16px}
.head .who{font-size:13px}.head .who b{font-weight:600}
.said{font-size:21px;line-height:1.35;font-weight:500;margin-top:16px;letter-spacing:-.01em}
.said .w.cur::after{content:"";display:inline-block;width:2px;height:.9em;background:#f4a6b0;margin-left:3px;vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.wave{color:#f4a6b0;height:50px;margin-top:14px}
.wave i.v-main{background:#fff}
.sees{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:#ffffff90;margin-top:14px;padding:4px 10px 4px 8px;border-radius:99px;background:#ffffff12}
.sees::before{content:"";width:7px;height:7px;border-radius:50%;background:#f4a6b0;box-shadow:0 0 0 3px #f4a6b033}
.foot{display:flex;justify-content:space-between;margin-top:16px;font-size:12px;color:#ffffff80}
.you{background:#ffffff14;border-radius:16px;padding:10px 14px;font-size:14.5px;line-height:1.4;margin-top:14px;color:#ffffffd0}
.you::before{content:"you";display:block;font-size:11px;color:#f4a6b0;margin-bottom:2px}
.main{font-size:19px;line-height:1.4;margin-top:14px;font-weight:500}
.chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{font:12.5px "JetBrains Mono",monospace;background:#ffffff16;border-radius:99px;padding:5px 12px}
.chip b{color:#f4a6b0;font-weight:400;margin-right:4px}
.chip.new.in{animation:flash 1s}
@keyframes flash{0%{background:#f4a6b0;color:#141211}100%{background:#ffffff16}}
.status{font-size:13px;color:#ffffffb0;margin-top:2px}
/* agents */
.list{margin-top:12px}
.row{display:grid;grid-template-columns:22px 104px 1fr auto;gap:8px;align-items:center;padding:9px 6px;border-top:1px solid #ffffff14;font-size:13.5px}
.row .gl{font-family:"JetBrains Mono",monospace;color:#ffffffb0;text-align:center}
.row .nm{font-family:"JetBrains Mono",monospace;font-size:13px}
.row .wh{color:#ffffffa0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ag{font:11px "JetBrains Mono",monospace;color:#ffffff60}
.row.done .gl,.row.need .gl{color:#f4a6b0}
.row.need{background:#f4a6b01c;border-radius:12px;border-color:transparent}
.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#ffffff70;margin:18px 0 4px}
.out{display:flex;gap:12px;align-items:center;padding:8px 6px;border-radius:12px}
.out:hover{background:#ffffff10}
.out .ic{width:34px;height:34px;border-radius:9px;background:#ffffff18;display:grid;place-items:center;font:12px "JetBrains Mono",monospace;color:#f4a6b0}
.out .t{font-size:13.5px}.out .u{font:11px "JetBrains Mono",monospace;color:#ffffff70}
/* the notification */
.note-n{position:absolute;right:20px;top:40px;width:400px;padding:14px 16px;border-radius:22px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;
  background:linear-gradient(180deg,#2a2224c0,#1a1516d8);backdrop-filter:blur(44px) saturate(1.9);-webkit-backdrop-filter:blur(44px) saturate(1.9);box-shadow:inset 0 0 0 1px #ffffff26,0 24px 70px -20px #000a}
.note-n .h{display:flex;gap:10px;align-items:center;font-size:12px;color:#ffffffa0}
.note-n .h .app{width:22px;height:22px;border-radius:6px;background:#141211;color:#f4a6b0;display:grid;place-items:center;font:700 10px "JetBrains Mono",monospace}
.note-n .ttl{font-weight:600;font-size:14.5px;margin-top:8px}
.note-n .q{font-size:14px;color:#ffffffd0;margin-top:2px}
.note-n .btns{display:flex;gap:8px;margin-top:12px}
.note-n .btns span{flex:1;text-align:center;background:#ffffff1c;border-radius:10px;padding:7px;font-size:13px}
.note-n .btns span.k{background:#f4a6b0;color:#141211}
.note-n .hint{font-size:11.5px;color:#ffffff80;margin-top:9px;text-align:center}
.ans{position:absolute;right:20px;top:296px}
.note-n.from-top[data-at]:not(.in){transform:translateY(-120%);opacity:0}
.note-n.from-top[data-at].in{transition:transform .7s cubic-bezier(.34,1.3,.5,1),opacity .3s}
.note-n.away[data-at].in{animation:away .5s forwards}
@keyframes away{to{transform:translateX(120%);opacity:0}}
/* the viewer */
.viewer{position:absolute;left:60px;top:58px;width:1040px;height:800px;border-radius:12px;overflow:hidden;background:#111;box-shadow:0 30px 80px -20px #000c,0 0 0 .5px #0008}
.viewer .wt{height:34px;background:#2b2b2e;display:flex;align-items:center;gap:8px;padding:0 12px;color:#bbb;font-size:12.5px}
.viewer .wt i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.viewer .wt i+i{background:#febc2e}.viewer .wt i+i+i{background:#28c840}
.viewer .wt .url{margin-left:40px;background:#1c1c1e;border-radius:7px;padding:3px 14px;min-width:420px;color:#ddd}
.vp{position:absolute;inset:34px 0 0 0;background:#161618;color:#e8e6e3;font-family:-apple-system,sans-serif}
.vp .ph{display:flex;gap:26px;padding:18px 34px 18px 96px;border-bottom:1px solid #2a2a2c;color:#8d8a86;font-size:14px}.vp .ph b{color:#fff;margin-right:40px}
.vp .pb{padding:26px 34px 26px 96px;font-size:15px;max-width:640px}
.vp h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#77736e;margin:16px 0 10px}
.vp .r{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #222224}
.vp .sw{display:flex;gap:8px}.vp .sw i{width:52px;height:30px;border-radius:7px;background:#3a3a3e;border:1px solid #4a4a4e}.vp .sw i.on{outline:2px solid #8ab4ff;outline-offset:2px}
.vp .bar{width:200px;height:9px;background:#2c2c30;border-radius:5px}
.vp .tg{width:40px;height:22px;border-radius:11px;background:#5b5b60;position:relative}.vp .tg::after{content:"";position:absolute;left:20px;top:2px;width:18px;height:18px;border-radius:50%;background:#bdbdc2}
.vp .card2{margin-top:22px;background:#1e1e21;border:1px solid #2c2c30;border-radius:12px;padding:16px 18px;color:#a9a6a2;font-size:14px}
/* the annotation layer: pen red only here */
.ann{position:absolute;inset:34px 0 0 0;pointer-events:none}
.tools{position:absolute;left:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:16px;background:#1d1a19e0;backdrop-filter:blur(20px);box-shadow:inset 0 0 0 1px #ffffff20;pointer-events:auto}
.tools span{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#ddd;font:15px "JetBrains Mono",monospace}
.tools span.on{background:#c8264a;color:#fff}
.pin{position:absolute;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#c8264a;color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px -4px #000a}
.pin b{transform:rotate(45deg);font:700 13px -apple-system,sans-serif}
.pin.pop[data-at]:not(.in){transform:rotate(-45deg) scale(.3)}
.pen{position:absolute;overflow:visible}
.pen path{fill:none;stroke:#c8264a;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s cubic-bezier(.65,0,.35,1)}
.pen.in path{stroke-dashoffset:0}
.bub{position:absolute;width:280px;padding:12px 14px;border-radius:16px;background:#1d1a19ee;backdrop-filter:blur(20px);box-shadow:inset 0 0 0 1px #ffffff22,0 14px 34px -10px #000c;color:#fff;font-size:14px;line-height:1.4}
.bub .by{font:11px "JetBrains Mono",monospace;color:#f4a6b0;margin-bottom:4px;display:flex;justify-content:space-between}
.bub .by i{font-style:normal;color:#ffffff70}
.send{position:absolute;right:20px;bottom:18px;display:flex;gap:10px;align-items:center;padding:10px 12px 10px 18px;border-radius:99px;background:#1d1a19ee;backdrop-filter:blur(20px);box-shadow:inset 0 0 0 1px #ffffff22;color:#fff;font-size:13.5px;pointer-events:auto}
.send b{background:#f4a6b0;color:#141211;border-radius:99px;padding:6px 14px;font-weight:600}
/* spotlight */
.dim-desk{position:absolute;inset:0;background:#0000;transition:background .4s}
.spot{position:absolute;left:50%;top:190px;width:680px;margin-left:-340px;border-radius:26px;overflow:hidden;color:#fff;font-family:-apple-system,sans-serif;
  background:linear-gradient(180deg,#2a2224c8,#1a1516e0);backdrop-filter:blur(50px) saturate(1.9);-webkit-backdrop-filter:blur(50px) saturate(1.9);box-shadow:inset 0 0 0 1px #ffffff26,0 40px 90px -20px #000c}
.spot .in1{display:flex;align-items:center;gap:14px;padding:16px 22px;font-size:24px;font-weight:400}
.spot .in1 .ph{color:#ffffff60}
.spot .typ .w.cur::after,.spot .caret{content:"";display:inline-block;width:2px;height:1em;background:#f4a6b0;margin-left:3px;vertical-align:-3px;animation:bl 1s steps(1) infinite}
.spot .res{border-top:1px solid #ffffff1a;padding:8px}
.spot .it{display:flex;gap:12px;align-items:center;padding:9px 14px;border-radius:12px;font-size:14.5px}
.spot .it.sel{background:#f4a6b02e}
.spot .it .k{margin-left:auto;font:11px "JetBrains Mono",monospace;color:#ffffff70}
.spot .it .ic{width:28px;text-align:center;font-family:"JetBrains Mono",monospace;color:#f4a6b0}
.spot .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#ffffff60;padding:8px 14px 2px}
.spot .ansr{padding:4px 14px 12px;font-size:15px;color:#ffffffd8;line-height:1.45}
/* the state sheet */
.sheet{position:absolute;inset:30px 0 0 0;padding:40px 46px;background:#0000003a;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.sheet h3{font:600 15px "JetBrains Mono",monospace;color:#fff;margin-bottom:18px}.sheet h3 span{color:#ffffffa0;font-weight:400}
.cols{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:26px}
.cols .lab{font:12px "JetBrains Mono",monospace;color:#ffffffb0;margin-bottom:8px}
.cols .g{position:relative;right:auto;top:auto;padding:16px;border-radius:22px;min-height:190px}
.cols .g .tx{font-size:14px;line-height:1.4;margin-top:10px}
.cols .g .tx small{display:block;color:#ffffff90;font-size:12.5px;margin-top:4px}
</style></head>
<body>
<script src="amb.js"></script>
<script src="orbs.js"></script>
<script>
const { W, AGENTS, OUTPUTS } = AMB;
// ?orb=liquid|nebula|droplets|cloud: the shader orbs of glass2.html instead of the pixel face
const ORBK = new URLSearchParams(location.search).get("orb");
const fc = (pose, cell = 5, extra = "") => ORBK
  ? `<canvas class="fc orb" data-orb="${pose}" style="width:${Math.round(cell * 20)}px;height:${Math.round(cell * 20)}px;margin:-${Math.round(cell * 3)}px 0" ${extra}></canvas>`
  : `<canvas class="fc" data-face="${pose}" data-cell="${cell}" data-shape="round" data-gap="${cell > 3 ? 1.2 : .4}" ${extra}></canvas>`;
const orbTick = (key, t, root) => root.querySelectorAll("canvas[data-orb]").forEach(cv => {
  const { p, s } = AMB.poseAt(cv.dataset.orb, cv.dataset.still != null ? 1.3 : t);
  const k = cv.closest("[data-k]"), lv = p === "speak" ? AMB.voice(s, 2) : (p === "talk" || p === "listen") && k ? AMB.levelAt(k.dataset.k, t).v : 0;
  ORB.draw(cv, ORBK, { t: performance.now() / 1000, pose: p, s, lvl: lv, need: key === "needs" && !k });
});
const vf = (x, y, w, h, at = 0.05) => `<div class="vf" data-at="${at}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><i></i><i></i><i></i><i></i></div>`;
const rows = (need) => AGENTS.map(([g, n, w, k], i) => `<div class="row ${k} ${need && n === "cookies" ? "need" : ""} rise" data-at="${0.25 + i * 0.09}"><span class="gl">${need && n === "cookies" ? "?" : k === "work" ? `<span data-gust="1"></span>` : g}</span><span class="nm">${n}</span><span class="wh">${need && n === "cookies" ? "needs you" : w}</span><span class="ag">${["2m", "6m", "4m", "9m", "1m"][i]}</span></div>`).join("");
AMB.mount({
  id: "a", letter: "A", name: ORBK ? "glass · " + ORBK : "glass", tray: ":*", tick: ORBK ? orbTick : null,
  pitch: "the closest to the reference: a frosted capsule that lives under the menu bar, top right, and grows when you hold fn. the orb is the voice-mode face, dot for dot, with its signed-off poses. system font for the words, mono for agent names and glyphs.",
  wall: "wall-a",
  screens: {
    idle: () => `<div class="g pill grow">${fc("rest", 4, 'data-gap=".5"')}<span>${W.idle}</span><span class="gust m" data-gust="4"></span></div>`,
    listen: () => `${vf(330, 300, 720, 520)}
      <div class="g card live grow" data-k="you@0.2-6">
        <div class="head">${fc("seq:listen@0,talk@0.35", 4)}<div class="who"><b>listening</b><div class="dim">let go of fn to send</div></div></div>
        <div class="said" data-type="0.4" data-per="0.24">${W.said}</div>
        <div class="wave" data-wave="you@0.35-6.2" data-n="44"></div>
        <div class="sees fade" data-at="0.5">main sees ${W.sees}</div>
      </div>`,
    talk: () => `<div class="g card">
        <div class="head">${fc("seq:rest@0,think@0.9,speak@2.1,kiss@6.6,rest@7.6", 4)}<div class="who"><b class="acc">main</b>
          <div class="status"><span class="fade" data-at="0" data-out="0.9">${W.got}</span></div><div class="status" style="margin-top:-22px"><span class="fade" data-at="0.9">on it.</span></div></div></div>
        <div class="you">${W.said}</div>
        <div class="main" data-type="2.1" data-per="0.3">${W.answer}</div>
        <div class="chips"><span class="chip new pop" data-at="5.1"><b>∿</b>dark-mode</span><span class="chip new pop" data-at="5.5"><b>∿</b>cookies</span></div>
      </div>`,
    agents: () => `<div class="g card grow">
        <div class="head">${fc("rest", 2.4)}<div class="who"><b>${W.idle}</b><div class="dim m" style="font-size:11.5px">~/acme · 5 agents</div></div></div>
        <div class="list">${rows(false)}</div>
        <div class="sec fade" data-at="0.9">for you</div>
        ${OUTPUTS.slice(0, 3).map(([k, t, u], i) => `<div class="out rise" data-at="${1 + i * 0.12}"><span class="ic">${{ page: "◰", pr: "PR", doc: "≡", img: "▣" }[k]}</span><div><div class="t">${t}</div><div class="u">${u}</div></div></div>`).join("")}
      </div>`,
    needs: () => `<div class="g pill" style="top:40px">${fc("rest", 4, 'data-gap=".5"')}<span><span class="acc m">?</span> ${W.needs.split(":")[0]}</span></div>
      <div class="note-n from-top" data-at="0.5" style="top:96px">
        <div class="h"><span class="app">:*</span>bise<span style="margin-left:auto">now</span></div>
        <div class="ttl">cookies needs you</div><div class="q">keep the banner on mobile?</div>
        <div class="btns"><span class="k">1 yes</span><span>2 no</span></div>
        <div class="hint">or hold fn and say it</div></div>
      <div class="g card ans rise" data-at="3.4" data-k="you@3.6-5.4" style="width:400px">
        <div class="head">${fc("seq:listen@0,talk@3.6,kiss@5.6,rest@6.6", 2.6)}<div class="who"><b>to cookies</b><div class="dim">your answer</div></div></div>
        <div class="said" style="font-size:18px" data-type="3.7" data-per="0.26">yes, keep it. half the size, under the buy button</div>
        <div class="sees fade" data-at="5.8" style="background:#f4a6b02a;color:#fff">✓ cookies has it</div></div>`,
    viewer: () => `<div class="viewer"><div class="wt"><i></i><i></i><i></i><span class="url">localhost:4801/settings · dark-mode's preview</span></div>
        <div class="vp"><div class="ph"><b>acme</b><span>settings</span><span>billing</span><span>team</span></div>
          <div class="pb"><h4>appearance</h4>
            <div class="r"><span>theme</span><span class="sw"><i></i><i class="on"></i><i></i></span></div>
            <div class="r"><span>density</span><span class="bar"></span></div>
            <h4>notifications</h4>
            <div class="r"><span>email me</span><span class="tg"></span></div>
            <div class="r"><span>weekly digest</span><span class="tg"></span></div>
            <div class="card2">billing · next invoice on nov 1 · €48</div></div></div>
        <div class="ann">
          <div class="tools"><span>◉</span><span class="on">✎</span><span>T</span><span>▭</span><span>🎙︎</span></div>
          <svg class="pen" data-at="1" style="left:560px;top:118px" width="240" height="90" viewBox="0 0 240 90"><path pathLength="1" d="M20 50 C 10 10, 200 0, 225 35 C 245 70, 120 92, 40 78 C 10 72, 12 50, 40 40"/></svg>
          <div class="pin pop" data-at="1.8" style="left:792px;top:100px"><b>1</b></div>
          <div class="bub rise" data-at="2.1" data-k="you@2.2-4.6" style="left:722px;top:150px"><div class="by">you · voice<i>0:04</i></div><span data-type="2.3" data-per="0.22">${W.note1}</span></div>
          <div class="pin pop" data-at="5.4" style="left:600px;top:300px"><b>2</b></div>
          <div class="bub rise" data-at="5.6" style="left:640px;top:330px"><div class="by">you · voice<i>0:02</i></div><span data-type="5.7" data-per="0.22">${W.note2}</span></div>
          <div class="send rise" data-at="7">2 notes for dark-mode · or just say "send" <b>send</b></div>
        </div></div>
      <div class="g pill" style="top:40px">${fc("seq:listen@0,talk@2.2,listen@4.6,talk@5.6,listen@7,kiss@8.2,rest@9.2", 4, 'data-gap=".5"')}<span>notes on <span class="m acc">settings</span></span></div>
      <div class="g card rise" data-at="8.2" style="top:96px;width:380px"><div class="head">${fc("seq:kiss@8.2,rest@9.2", 2.4)}<div class="who"><b class="acc">main</b><div class="status">sent. dark-mode is on it.</div></div></div></div>`,
    spotlight: () => `<div class="dim-desk" style="background:#0000004a"></div>
      <div class="spot grow"><div class="in1">${fc("seq:rest@0,think@2.6,speak@3.4,kiss@5.2,rest@6", 1.6)}<span class="typ" data-type="0.4" data-per="0.2">what's perf doing?</span></div>
        <div class="res">
          <div class="grp fade" data-at="2.6">main</div>
          <div class="ansr rise" data-at="3.4"><span data-type="3.4" data-per="0.16">${W.done} ${W.doneTouch}</span></div>
          <div class="grp fade" data-at="1">agents</div>
          <div class="it sel rise" data-at="1"><span class="ic">✓</span>perf<span class="dim">· is done · 4.1 s → 0.9 s</span><span class="k">⏎ open</span></div>
          <div class="grp fade" data-at="1.2">for you</div>
          <div class="it rise" data-at="1.2"><span class="ic">◰</span>signup flame graph, before / after<span class="k">localhost:4804</span></div>
          <div class="it rise" data-at="1.35"><span class="ic">PR</span>PR #479 · perf: lazy-load the signup fonts<span class="k">⌘⏎</span></div>
          <div class="grp fade" data-at="1.5">say or type</div>
          <div class="it rise" data-at="1.5"><span class="ic">+</span>start an agent<span class="k">tab</span></div>
          <div class="it rise" data-at="1.6"><span class="ic">?</span>open the inbox · 1 waiting<span class="k">⌘I</span></div>
        </div></div>`,
    sheet: () => `<div class="sheet"><h3>A · glass <span>· the same words in every direction</span></h3>
        <div class="cols">
          ${[["idle", "rest", W.idle, ""], ["listening", "seq:listen@0,talk@0.6", "dark mode for the settings page", "let go of fn to send"], ["thinking", "think", W.got, W.on], ["needs you", "rest", W.needs, "1 yes · 2 no"], ["done", "seq:kiss@0,rest@1", W.done, W.doneTouch]]
            .map(([l, p, a, b]) => `<div><div class="lab">${l}</div><div class="g ${l === "listening" ? "live" : ""}" data-k="you@0-99">${fc(p, 3)}<div class="tx">${l === "needs you" ? `<span class="acc m">?</span> ` : ""}${a}<small>${b}</small></div></div></div>`).join("")}
        </div>
        <h3>reduced motion <span>· one still frame per state: no halo, no kiss, no gust</span></h3>
        <div class="cols">
          ${[["idle", "rest", W.idle], ["listening", "talk", "dark mode for the settings page"], ["thinking", "think", W.on], ["needs you", "rest", W.needs], ["failed", "rest", W.fail]]
            .map(([l, p, a]) => `<div><div class="lab">${l}</div><div class="g" style="min-height:150px">${fc(p, 3, "data-still")}<div class="tx">${l === "failed" ? `<span class="m" style="color:#ff8a84">▲</span> ` : ""}${a}</div></div></div>`).join("")}
        </div></div>`,
  },
  notes: {
    idle: "<b>idle.</b> a capsule under the menu bar: the face at rest (the sideways smile, it blinks), one line of status, the breeze while agents work. nothing else asks for your eyes.",
    listen: "<b>hold fn.</b> the capsule grows into a card, the face opens its smile, your words land as you say them. <em>main sees your screen:</em> on fn down, one screenshot of the front window, shown only as pink corners for a blink and the chip “main sees Chrome · …”. never a preview, never stored past the turn (to decide).",
    talk: "<b>let go.</b> “:* got it.”, then “main is on it.” while the * turns. main answers aloud and in text, the new agents pop in as chips, the turn ends with the kiss.",
    agents: "<b>agents.</b> say “what's running?” or click the capsule: every agent with its status glyph, then <em>for you</em>: what they made, pages first (a preview served on localhost), then PRs, docs, images.",
    needs: "<b>needs you.</b> a system notification, in the same glass. 1 / 2 answer it from the keyboard; or hold fn and just say it. the answer goes straight to the agent that asked.",
    viewer: "<b>output + notes.</b> a page an agent made opens in your browser with bise's note layer on top: draw, pin, type or talk. each voice note lands as a pin with its words. “send” (said or clicked) gives every note to the agent that made the page.",
    spotlight: "<b>spotlight.</b> when you can't talk out loud: type to main. it searches agents and outputs as you type, and main answers right there.",
    sheet: "<b>state sheet.</b> the five states with the same words in all four directions, then the reduced-motion stills (and the failure, said plainly).",
  },
});
</script>
</body></html>
