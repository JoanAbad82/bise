<!doctype html>
<meta charset="utf-8">
<title>bise · text appearing (streaming mock)</title>
<style>
.light { --bg:#fdfbf7; --text:#1b1917; --dim:#6b645a; --faint:#7d766c; --line:color-mix(in srgb,#1b1917 10%,transparent); --raised:#f4f0e8; --acc:#b8416b; --ok:#3f7a2a; --code:#efe9df; }
.dark  { --bg:#141211; --text:#ece6da; --dim:#a39c90; --faint:#857d72; --line:color-mix(in srgb,#ece6da 10%,transparent); --raised:#1f1c1a; --acc:#f4a6b0; --ok:#b9d99a; --code:#231f1d; }
body { margin:0; background:#777; font:13px -apple-system,BlinkMacSystemFont,sans-serif; }
.bar { display:flex; gap:14px; align-items:center; padding:10px 16px; color:#fff; font:12px ui-monospace,monospace; }
.bar button { font:inherit; padding:3px 10px; border-radius:6px; border:0; cursor:pointer; }
.panes { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 10px 10px; }
.pane { background:var(--bg); color:var(--text); border-radius:10px; height:640px; display:flex; flex-direction:column; overflow:hidden; }
.thread { flex:1; overflow:auto; padding:20px 24px 8px; }
.col { max-width:720px; margin:0 auto; }
.name { font-size:12px; color:var(--faint); margin:14px 0 2px; } .name b { color:var(--text); font-weight:600; margin-right:5px; }
.you { background:var(--raised); border-radius:12px; padding:8px 12px; width:fit-content; max-width:68ch; font-size:15px; line-height:1.45; }
.msg { font-size:15px; line-height:1.5; max-width:68ch; }
.msg p { margin:0 0 10px; }
.msg ul { margin:0 0 10px; padding-left:18px; list-style:none; }
.msg li { position:relative; margin:2px 0; } .msg li::before { content:"–"; color:var(--acc); position:absolute; left:-14px; }
.msg strong { color:var(--acc); font-weight:650; }
.msg code { font:13px ui-monospace,"SF Mono",Menlo,monospace; color:var(--ok); }
.pre { font:12.5px/1.55 ui-monospace,"SF Mono",Menlo,monospace; background:var(--code); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:0 0 10px; white-space:pre; overflow-x:auto; }
.pre .kw { color:#9b6bd1; } .pre .fn { color:#4f86c6; } .pre .num { color:#b8862b; }
.msg table { border-collapse:collapse; margin:0 0 10px; font-size:14px; table-layout:fixed; }
.msg th { text-align:left; font-weight:600; padding:3px 18px 3px 0; border-bottom:1px solid var(--line); }
.msg td { padding:3px 18px 3px 0; font-variant-numeric:tabular-nums; }
.tail { display:inline-block; margin-left:4px; color:var(--text); animation:pulse .8s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity:.62; } }
.comp { margin:6px 24px 16px; max-width:720px; align-self:center; width:calc(100% - 48px); border:1px solid var(--line); border-radius:12px; padding:11px 14px; color:var(--faint); font-size:14px; box-sizing:border-box; }

/* THE RULE: only what just arrived fades in; nothing moves */
.in { animation:appear 180ms ease-out both; }
@keyframes appear { from { opacity:0; } to { opacity:1; } }
.reduce .in { animation:none; }
.reduce .tail { animation:none; color:var(--dim); }
.label { color:#fff; font:11px ui-monospace,monospace; padding:0 0 4px 2px; }
</style>
<body>
<div class="bar">
  <button id="play">▶ replay</button>
  <label><input type="checkbox" id="rm"> reduced motion</label>
  <span id="st">updates every 250 ms · words of each update fade in over 180 ms, staggered</span>
</div>
<div class="panes">
  <div><div class="label">light</div><div class="pane light"><div class="thread"><div class="col" id="a"></div></div><div class="comp">write to bise</div></div></div>
  <div><div class="label">dark</div><div class="pane dark"><div class="thread"><div class="col" id="b"></div></div><div class="comp">write to bise</div></div></div>
</div>
<script>
// the answer, as blocks; a stream of updates reveals it a few words at a time
const BLOCKS = [
  { t:'p', w:'the cold bench reloads the whole cache from disk on every run, while the warm one keeps it in memory. so most of the gap is the **disk read** and the parse, not the work itself.' },
  { t:'ul', items:['keep a parsed copy next to the raw file', 'read it with `mmap` instead of `read_to_end`', 'drop the second parse in `warm_up`'] },
  { t:'pre', lines:['<span class="kw">fn</span> <span class="fn">cold_bench</span>(cache: &amp;<span class="kw">mut</span> Cache, runs: usize) -&gt; Duration {', '    <span class="kw">let</span> start = Instant::<span class="fn">now</span>();', '    <span class="kw">for</span> _ <span class="kw">in</span> <span class="num">0</span>..runs { cache.<span class="fn">reload</span>(); }', '    start.<span class="fn">elapsed</span>()', '}'] },
  { t:'table', head:['run','cold','warm'], rows:[['1','412 ms','131 ms'],['2','405 ms','128 ms'],['3','419 ms','133 ms']] },
  { t:'p', w:'with the parsed copy, the cold run drops to **140 ms**. want me to land it?' },
];
const md = (s) => s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');
// split into "units" the stream reveals: words in prose, whole list items, whole code lines, whole table rows
function units() {
  const u = [];
  BLOCKS.forEach((b, bi) => {
    if (b.t === 'p') md(b.w).split(/(?<=\s)/).forEach((x) => u.push({ bi, kind:'word', html:x }));
    if (b.t === 'ul') b.items.forEach((x) => md(x).split(/(?<=\s)/).forEach((y, k) => u.push({ bi, kind:'li', first:k===0, html:y })));
    if (b.t === 'pre') b.lines.forEach((x) => u.push({ bi, kind:'line', html:x }));
    if (b.t === 'table') { u.push({ bi, kind:'head', cells:b.head }); b.rows.forEach((r) => u.push({ bi, kind:'row', cells:r })); }
  });
  return u;
}
const U = units();
let timer = null;
function run() {
  clearInterval(timer);
  const roots = [document.getElementById('a'), document.getElementById('b')];
  roots.forEach((r) => { r.innerHTML = '<div class="name"><b>you</b>17:48</div><div class="you">why is the cold bench three times slower than the warm one?</div><div class="name"><b>bise</b>17:49</div><div class="msg"></div>'; });
  let i = 0;
  const state = roots.map((r) => ({ msg: r.querySelector('.msg'), blocks: {}, tail: null }));
  const step = () => {
    // one update: 3 to 7 units arrive at once, like a 250 ms batch of tokens
    const n = 3 + Math.floor(Math.random() * 5);
    const batch = U.slice(i, i + n); i += n;
    state.forEach((s) => apply(s, batch));
    if (i >= U.length) { clearInterval(timer); state.forEach(finish); }
  };
  step(); timer = setInterval(step, 250);
}
function apply(s, batch) {
  if (s.tail) s.tail.remove();
  batch.forEach((u, k) => {
    const delay = Math.round(k * Math.min(30, 120 / batch.length)); // stagger inside the 250 ms window
    const b = BLOCKS[u.bi];
    let el = s.blocks[u.bi];
    if (!el) {
      el = document.createElement(b.t === 'pre' ? 'div' : b.t);
      if (b.t === 'pre') { el.className = 'pre in'; } // the code box frame appears once, then only lines fade
      if (b.t === 'table') el.innerHTML = '<thead></thead><tbody></tbody>';
      s.msg.appendChild(el); s.blocks[u.bi] = el;
    }
    let span;
    if (u.kind === 'word') { span = document.createElement('span'); span.innerHTML = u.html; el.appendChild(span); }
    if (u.kind === 'li') { if (u.first) { const li = document.createElement('li'); li.className = 'in'; li.style.animationDelay = delay + 'ms'; el.appendChild(li); } span = document.createElement('span'); span.innerHTML = u.html; el.lastChild.appendChild(span); }
    if (u.kind === 'line') { span = document.createElement('div'); span.innerHTML = u.html || ' '; el.appendChild(span); }
    if (u.kind === 'head') { span = document.createElement('tr'); span.innerHTML = u.cells.map((c) => `<th>${c}</th>`).join(''); el.tHead.appendChild(span); }
    if (u.kind === 'row') { span = document.createElement('tr'); span.innerHTML = u.cells.map((c) => `<td>${c}</td>`).join(''); el.tBodies[0].appendChild(span); }
    span.classList.add('in'); span.style.animationDelay = delay + 'ms';
    // after its fade, a span stops being special (in the app: merge it into the text node)
    span.addEventListener('animationend', () => { span.classList.remove('in'); span.style.animationDelay = ''; }, { once: true });
  });
  // the working sign rides after the last word
  const last = s.msg.lastElementChild; const host = last && last.tagName === 'UL' ? last.lastChild : last;
  s.tail = document.createElement('span'); s.tail.className = 'tail'; s.tail.textContent = '∿';
  if (host && host.tagName !== 'TABLE' && !host.classList.contains('pre')) host.appendChild(s.tail); else s.msg.appendChild(s.tail);
  const t = s.msg.closest('.thread'); t.scrollTop = t.scrollHeight; // follow only when he is at the bottom (here: always)
}
function finish(s) { if (s.tail) { s.tail.remove(); s.tail = null; } }
document.getElementById('play').onclick = run;
document.getElementById('rm').onchange = (e) => document.querySelectorAll('.pane').forEach((p) => p.classList.toggle('reduce', e.target.checked));
run();
</script>
</body>
